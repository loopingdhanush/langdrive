services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-drive-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: aidrive
      POSTGRES_USER: aidrive
      POSTGRES_PASSWORD: aidrive_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: